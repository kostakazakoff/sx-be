name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  BACKEND_DIR: "/var/www/gig_construct/backend"
  NEXT_DIR: "/var/www/gig_construct/frontend"
  PHP_VERSION: "8.3"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # -------------------------------
    # Checkout repository (local workflow)
    # -------------------------------
    - name: Checkout repository
      uses: actions/checkout@v3

    # -------------------------------
    # Setup SSH
    # -------------------------------
    - name: Setup SSH key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # -------------------------------
    # Pull & deploy on VPS
    # -------------------------------
    - name: Deploy on VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
        set -e
        echo "======================================"
        echo "Deploying project on VPS"
        echo "======================================"

        # -------------------------------
        # Backend: update code
        # -------------------------------
        cd /var/www/gig_construct/backend

        # Ensure SSH remote URL
        git remote set-url origin git@github.com:username/repo.git
        git fetch origin main
        git reset --hard origin/main

        # Run safe rebuild script
        cd /var/www/gig_construct
        chmod +x safe-rebuild-laravel.sh
        ./safe-rebuild-laravel.sh

        # -------------------------------
        # Frontend: NEXT.js build
        # -------------------------------
        cd /var/www/gig_construct/frontend
        git fetch origin main
        git reset --hard origin/main

        npm ci
        npm run build
        pm2 restart nextjs || pm2 start ecosystem.config.js --only nextjs

        echo "======================================"
        echo "Deploy complete!"
        echo "======================================"
        EOF
