name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ------------------------
      # 1. Checkout repository
      # ------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      # ------------------------
      # 2. Setup SSH
      # ------------------------
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # ------------------------
      # 3. Deploy on VPS
      # ------------------------
      - name: Deploy to VPS
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            set -e

            echo "======================================"
            echo "Pull latest code from main branch"
            echo "======================================"
            cd /var/www/gig_construct
            git fetch origin main
            git reset --hard origin/main

            echo "======================================"
            echo "Install Laravel and NPM dependencies"
            echo "======================================"
            cd backend
            composer install --optimize-autoloader --no-dev --no-interaction
            npm ci
            npm run build

            echo "======================================"
            echo "Run safe Laravel rebuild"
            echo "======================================"
            chmod +x safe-rebuild-laravel.sh
            ./safe-rebuild-laravel.sh

            echo "======================================"
            echo "Restart PM2 processes (NEXT + laravel-queue)"
            echo "======================================"
            cd /var/www/gig_construct
            pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js

            # ===============================
            # Fix permissions for Laravel + Vite + PM2 NEXT
            # ===============================
            sudo chown -R kosta:www-data /var/www/gig_construct/backend
            sudo chmod -R 750 /var/www/gig_construct/backend/public
            sudo chown -R kosta:www-data /var/www/gig_construct/backend/storage /var/www/gig_construct/backend/bootstrap/cache
            sudo chmod -R 775 /var/www/gig_construct/backend/storage /var/www/gig_construct/backend/bootstrap/cache
            sudo chown www-data:www-data /run/php/php-fpm.sock
            sudo chmod 660 /run/php/php-fpm.sock


            echo "======================================"
            echo "✅ Deploy completed successfully!"
            echo "======================================"
            EOF
