name: Deploy Dry Run (SSH test)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (not really needed, but ok)
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: SSH dry run
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            echo "✅ SSH login successful"
            whoami
            hostname
            pwd
            date

            echo "---- backend permissions ----"
            ls -ld /var/www/gig_construct/backend || true
            ls -ld /var/www/gig_construct/backend/storage || true
          EOF
